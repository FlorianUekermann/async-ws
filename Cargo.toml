[package]
name = "async-ws"
version = "0.4.1"
edition = "2021"
description = "async websocket implementation"
license = "Apache-2.0 OR MIT"

[dependencies]
http = "1.0.0"
futures = "0.3.17"
ring = "0.17"
base64 = "0.22"
log = "0.4.14"
thiserror = "2.0"
rand = "0.9"
utf-8 = "0.7.6"
async-io = "2.0.0"
strum = { version = "0.28", features = ["derive"] }

[dev-dependencies]
futures = { version = "0.3.17", features = ["executor"] }
futures-lite = "2.0.0"
async-http-codec = "0.8.0"
async-net = "2.0.0"
simple_logger = "5.0.0"
anyhow = "1.0.48"
smol-timeout = "0.6.0"